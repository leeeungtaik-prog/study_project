<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환율 변환기</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="panel">
    <h1>환율 변환기</h1>

    <label class="field">
      <span class="label">금액</span>
      <input type="number" id="amount" value="1" min="0" step="any" inputmode="decimal">
    </label>
    <p id="error" class="error" role="alert" hidden></p>

    <div class="selectors">
      <label class="field">
        <span class="label">From</span>
        <select id="from"></select>
      </label>

      <button type="button" id="swap" class="swap" aria-label="환율 스왑">
        <span class="swap-icon">⇄</span>
      </button>

      <label class="field">
        <span class="label">To</span>
        <select id="to"></select>
      </label>
    </div>

    <div class="field">
      <span class="label">변환 결과</span>
      <output id="result" class="result" for="amount from to">0</output>
    </div>

    <p id="rate" class="rate"></p>
    <p id="status" class="status"></p>
  </main>
</body>
</html>
